name: G3A synthetic and anti-lookahead checks
on:
  push:
    branches:
      - research/g3-learning-value
  workflow_dispatch:

jobs:
  g3-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile G3 and the frozen G2 solver
        run: |
          python -m py_compile RL/scripts/sequentiality_test.py RL/scripts/g3_learning_value.py
      - name: Synthetic negative controls
        run: |
          python -m unittest discover -s RL/tests -p 'test_g3_learning_value.py' -v
