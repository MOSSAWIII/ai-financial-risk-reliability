name: G4 transition causal checks

on:
  push:
    branches:
      - research/g4-problem-redesign
  pull_request:
    paths:
      - "RL/scripts/g4_transition_builder.py"
      - "RL/tests/test_g4_transition_builder.py"
      - "RL/configs/g4_transition_protocol.json"
      - ".github/workflows/g4-transition-checks.yml"

jobs:
  causal-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile transition builder
        run: python -m py_compile RL/scripts/g4_transition_builder.py
      - name: Run G4.2 synthetic causal tests
        run: python -m unittest discover -s RL/tests -p 'test_g4_transition_builder.py' -v
      - name: Run G4.2 source semantic tests
        run: python -m unittest discover -s RL/tests -p 'test_g4_source_semantic_audit.py' -v

  source-semantic-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit current Yahoo historical slices
        run: python RL/scripts/g4_source_semantic_audit.py --output-dir g4-source-audit
      - name: Build empirical point-in-time transitions from causal slices
        shell: bash
        run: |
          python RL/scripts/g4_transition_builder.py \
            --output g4-source-audit/g4_weekly_market_transitions.jsonl \
            --input "SPY=$(find g4-source-audit -name 'spy_historical_slice_*.json' -print -quit)" \
            --input "IEF=$(find g4-source-audit -name 'ief_historical_slice_*.json' -print -quit)" \
            --input "GLD=$(find g4-source-audit -name 'gld_historical_slice_*.json' -print -quit)" \
            --input "BIL=$(find g4-source-audit -name 'bil_historical_slice_*.json' -print -quit)"
      - name: Upload canonical audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: g4-source-semantic-audit
          path: g4-source-audit/
          if-no-files-found: error
          retention-days: 30
